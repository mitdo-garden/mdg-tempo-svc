name: deploy production ECR

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: mdg-tempo-svc-prd
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Build, push, and deploy
    runs-on: ubuntu-latest
    environment:
      name: mitdo-cloud-tempo-svc-prd

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate AWS deployment variables
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail
          test -n "$AWS_REGION" || (echo "Missing GitHub environment variable: AWS_REGION" >&2; exit 1)
          test -n "$AWS_ROLE_ARN" || (echo "Missing GitHub environment variable: AWS_ROLE_ARN" >&2; exit 1)
          test -n "$ECR_REPOSITORY" || (echo "Missing GitHub environment variable: ECR_REPOSITORY" >&2; exit 1)
          test -n "$EC2_INSTANCE_ID" || (echo "Missing GitHub environment variable: EC2_INSTANCE_ID" >&2; exit 1)

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: github-actions-tempo-${{ github.run_id }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" >/dev/null 2>&1 || aws ecr create-repository --repository-name "$ECR_REPOSITORY" >/dev/null
          docker build --tag "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" --tag "$ECR_REGISTRY/$ECR_REPOSITORY:latest" .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"

      - name: Deploy Docker image on EC2 through SSM
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          PARAMETERS=$(python3 - <<'PY'
          import json
          import os

          image = f"{os.environ['ECR_REGISTRY']}/{os.environ['ECR_REPOSITORY']}:{os.environ['IMAGE_TAG']}"
          commands = [
              "set -euo pipefail",
              f"echo 'Deploying mdg-tempo-svc image: {image}'",
              "if [ ! -f /etc/mdg-tempo-svc.env ]; then echo 'ERROR: /etc/mdg-tempo-svc.env does not exist on EC2' >&2; exit 1; fi",
              "chmod 600 /etc/mdg-tempo-svc.env",
              "command -v docker >/dev/null || (echo 'ERROR: Docker is not installed' >&2; exit 1)",
              "command -v curl >/dev/null || (echo 'ERROR: curl is not installed' >&2; exit 1)",
              "aws ecr get-login-password --region '" + os.environ["AWS_REGION"] + "' | docker login --username AWS --password-stdin '" + os.environ["ECR_REGISTRY"] + "'",
              f"docker pull '{image}'",
              f"docker image inspect '{image}' --format 'digest={{json .RepoDigests}} size={{.Size}}'",
              "mkdir -p /var/lib/mdg-tempo-svc/uploads",
              "docker rm -f mdg-tempo-svc 2>/dev/null || true",
              f"docker run -d --name mdg-tempo-svc --restart unless-stopped -p 8081:8081 --env-file /etc/mdg-tempo-svc.env -v /var/lib/mdg-tempo-svc/uploads:/app/uploads '{image}'",
              "printf '%s\\n' '[Unit]' 'Description=Mitdo Garden Tempo Service' 'After=network-online.target docker.service' 'Requires=docker.service' '' '[Service]' 'Restart=always' 'ExecStart=/usr/bin/docker start -a mdg-tempo-svc' 'ExecStop=/usr/bin/docker stop mdg-tempo-svc' '' '[Install]' 'WantedBy=multi-user.target' > /etc/systemd/system/mdg-tempo-svc.service",
              "systemctl daemon-reload",
              "systemctl enable mdg-tempo-svc",
              "systemctl restart mdg-tempo-svc",
              "docker ps -a --filter name=^/mdg-tempo-svc$ --format 'table {{.Names}}\\t{{.Status}}\\t{{.Image}}\\t{{.Ports}}'",
              "docker inspect mdg-tempo-svc --format 'container_id={{.Id}} image={{.Config.Image}} status={{.State.Status}} exit_code={{.State.ExitCode}} restart_count={{.RestartCount}}'",
              "for i in $(seq 1 30); do echo \"Health check attempt $i/30\"; if curl -v -fsS http://127.0.0.1:8081/healthz; then echo 'Health check passed'; exit 0; fi; echo 'Health check failed; container logs:'; docker logs --tail 50 mdg-tempo-svc 2>&1 || true; sleep 2; done",
              "echo 'Health check timed out after 30 attempts' >&2",
              "docker ps -a --filter name=^/mdg-tempo-svc$",
              "docker inspect mdg-tempo-svc --format 'status={{.State.Status}} exit_code={{.State.ExitCode}} error={{.State.Error}} restart_count={{.RestartCount}}'",
              "docker logs --tail 100 mdg-tempo-svc 2>&1 || true",
              "exit 1",
          ]
          print(json.dumps({"commands": commands}))
          PY
          )

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy mdg-tempo-svc ${IMAGE_TAG} to EC2" \
            --parameters "$PARAMETERS" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command ID: $COMMAND_ID"

          WAIT_STATUS=0
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" || WAIT_STATUS=$?

          COMMAND_STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query 'Status' \
            --output text)

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query '{status:Status,status_details:StatusDetails,exit_code:ResponseCode,stdout:StandardOutputContent,stderr:StandardErrorContent}' \
            --output json || true

          echo "SSM command status: $COMMAND_STATUS"
          echo "SSM wait status: $WAIT_STATUS"
          test "$COMMAND_STATUS" = "Success" && test "$WAIT_STATUS" -eq 0
